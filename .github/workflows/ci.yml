name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers starts Postgres 16 and Redis 7 on the runner's Docker daemon.
      - name: Unit, integration and e2e tests
        run: mvn -B test -DexcludedGroups=performance
