spring:
  application:
    name: jobs180
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/company_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:tracker}
    password: ${SPRING_DATASOURCE_PASSWORD:tracker}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: ct:session
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_BYTES:10485760}
      max-request-size: ${APP_UPLOAD_MAX_BYTES:10485760}
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

app:
  storage-type: ${APP_STORAGE_TYPE:s3}
  upload-max-bytes: ${APP_UPLOAD_MAX_BYTES:10485760}
  idempotency-ttl-seconds: ${APP_IDEMPOTENCY_TTL_SECONDS:86400}
  signups-enabled: ${APP_SIGNUPS_ENABLED:true}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  display-zone: ${APP_DISPLAY_ZONE:UTC}
  s3:
    endpoint: ${APP_S3_ENDPOINT:http://localhost:9000}
    bucket: ${APP_S3_BUCKET:jobs180}
    access-key: ${APP_S3_ACCESS_KEY:minioadmin}
    secret-key: ${APP_S3_SECRET_KEY:minioadmin}
    region: ${APP_S3_REGION:us-east-1}
    path-style: ${APP_S3_PATH_STYLE:true}
  rate-limit:
    login-per-min: ${APP_RATE_LIMIT_LOGIN_PER_MIN:5}
    signup-per-min: ${APP_RATE_LIMIT_SIGNUP_PER_MIN:3}
    write-per-min: ${APP_RATE_LIMIT_WRITE_PER_MIN:60}
    upload-per-min: ${APP_RATE_LIMIT_UPLOAD_PER_MIN:10}
    ip-per-min: ${APP_RATE_LIMIT_IP_PER_MIN:120}

logging:
  level:
    root: INFO
    com.companytracker: INFO
