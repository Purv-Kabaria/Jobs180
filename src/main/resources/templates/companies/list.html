<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Companies — Jobs180</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments :: topbar}"></div>
<main class="container">
    <div th:if="${success}" class="flash ok" th:text="${success}"></div>
    <div th:if="${error}" class="flash err" th:text="${error}"></div>
    <div class="actions" style="justify-content:space-between;align-items:center">
        <h1 style="margin:0">Companies</h1>
        <a class="btn" th:href="@{/companies/new}">Add company</a>
    </div>
    <form method="get" class="panel" style="display:flex;gap:0.75rem;align-items:end">
        <div style="flex:1">
            <label for="q">Search</label>
            <input id="q" name="q" th:value="${q}" placeholder="Company name"/>
        </div>
        <button type="submit">Filter</button>
    </form>
    <section class="panel">
        <p th:if="${companies.totalElements == 0}" class="empty">No companies yet.</p>
        <table th:if="${companies.totalElements > 0}">
            <thead><tr><th>Name</th><th>Industry</th><th>Location</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${companies.content}">
                <td><a th:href="@{/companies/{id}(id=${c.id})}" th:text="${c.name}">Name</a></td>
                <td th:text="${c.industry}">-</td>
                <td th:text="${c.location}">-</td>
                <td><a th:href="@{/companies/{id}/edit(id=${c.id})}">Edit</a></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
